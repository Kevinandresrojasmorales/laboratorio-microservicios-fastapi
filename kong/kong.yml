_format_version: "3.0"
_transform: true

services:
  - name: usuarios
    url: http://usuarios:8000
    routes:
      - name: ruta-usuarios
        paths:
          - /usuarios
        strip_path: false

  - name: productos
    url: http://productos:8000
    routes:
      - name: ruta-productos
        paths:
          - /productos
        strip_path: false

  - name: pedidos
    url: http://pedidos:8000
    routes:
      - name: ruta-pedidos
        paths:
          - /pedidos
        strip_path: false
